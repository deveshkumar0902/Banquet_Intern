<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{subject}}</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background: #f6ede2;
      font-family: Arial, Helvetica, sans-serif;
      color: #2a211c;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background: #f6ede2"
    >
      <tr>
        <td align="center" style="padding: 24px 12px">
          <table
            role="presentation"
            width="600"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 600px;
              width: 100%;
              background: #ffffff;
              border-radius: 12px;
              overflow: hidden;
            "
          >
            <tr>
              <td style="background: #3b1d10; padding: 20px 28px">
                <span
                  style="
                    font-family: Georgia, 'Times New Roman', serif;
                    font-size: 22px;
                    color: #e7c78a;
                  "
                  >{{brandName}}</span
                >
              </td>
            </tr>
            <tr>
              <td style="padding: 28px; font-size: 15px; line-height: 1.6">{{content}}</td>
            </tr>
            <tr>
              <td
                style="
                  padding: 16px 28px;
                  background: #fcf8f3;
                  border-top: 1px solid #eadbc8;
                  font-size: 12px;
                  color: #5e544d;
                "
              >
                {{brandName}} · {{brandContact}}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
