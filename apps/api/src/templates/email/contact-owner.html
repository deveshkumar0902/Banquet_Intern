<h1
  style="
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 20px;
    color: #a04e2a;
    margin: 0 0 12px;
  "
>
  New message #{{id}}: {{subjectLine}}
</h1>
<p style="margin: 0 0 4px"><strong>{{name}}</strong></p>
<p style="margin: 0 0 4px">
  Phone: <a href="{{phoneHref}}" style="color: #a04e2a">{{phone}}</a> ·
  <a href="{{whatsappHref}}" style="color: #a04e2a">WhatsApp</a>
</p>
<p style="margin: 0 0 12px">Email: {{email}}</p>
<p style="margin: 0; padding: 12px; background: #fcf8f3; border-radius: 8px; white-space: pre-wrap">
  {{message}}
</p>
