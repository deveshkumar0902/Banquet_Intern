<h1
  style="
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 22px;
    color: #a04e2a;
    margin: 0 0 12px;
  "
>
  Thanks for getting in touch, {{name}}
</h1>
<p style="margin: 0 0 12px">
  We've received your message about <strong>{{subjectLine}}</strong> and will reply soon.
</p>
<p style="margin: 0 0 4px; color: #5e544d">Your message:</p>
<p
  style="
    margin: 0 0 16px;
    padding: 12px;
    background: #fcf8f3;
    border-radius: 8px;
    white-space: pre-wrap;
  "
>
  {{message}}
</p>
<p style="margin: 0">Warm regards,<br />Team {{brandName}}</p>
