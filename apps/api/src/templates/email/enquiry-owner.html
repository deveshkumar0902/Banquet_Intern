<h1
  style="
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 20px;
    color: #a04e2a;
    margin: 0 0 12px;
  "
>
  New enquiry #{{id}}
</h1>
<p style="margin: 0 0 4px"><strong>{{name}}</strong></p>
<p style="margin: 0 0 4px">
  Phone: <a href="{{phoneHref}}" style="color: #a04e2a">{{phone}}</a> ·
  <a href="{{whatsappHref}}" style="color: #a04e2a">WhatsApp</a>
</p>
<p style="margin: 0 0 12px">Email: {{email}}</p>
<table
  role="presentation"
  cellpadding="0"
  cellspacing="0"
  width="100%"
  style="margin: 16px 0; border-collapse: collapse; font-size: 14px"
>
  <tr>
    <td style="padding: 8px 0; border-bottom: 1px solid #eadbc8; color: #5e544d; width: 40%">
      Event
    </td>
    <td style="padding: 8px 0; border-bottom: 1px solid #eadbc8">{{eventType}}</td>
  </tr>
  <tr>
    <td style="padding: 8px 0; border-bottom: 1px solid #eadbc8; color: #5e544d">Date</td>
    <td style="padding: 8px 0; border-bottom: 1px solid #eadbc8">{{eventDate}}</td>
  </tr>
  <tr>
    <td style="padding: 8px 0; border-bottom: 1px solid #eadbc8; color: #5e544d">Guests</td>
    <td style="padding: 8px 0; border-bottom: 1px solid #eadbc8">{{guests}}</td>
  </tr>
  <tr>
    <td style="padding: 8px 0; border-bottom: 1px solid #eadbc8; color: #5e544d">Venue</td>
    <td style="padding: 8px 0; border-bottom: 1px solid #eadbc8">{{venue}}</td>
  </tr>
  <tr>
    <td style="padding: 8px 0; border-bottom: 1px solid #eadbc8; color: #5e544d">Message</td>
    <td style="padding: 8px 0; border-bottom: 1px solid #eadbc8; white-space: pre-wrap">
      {{message}}
    </td>
  </tr>
</table>
<p style="margin: 0; font-size: 13px; color: #5e544d">
  Please call back within 24 hours. The customer was told to expect it.
</p>
